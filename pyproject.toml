[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluxfast-mvc-ecommerce"
version = "0.1.0"
description = "E-Commerce showcase demonstrating the Model-View-Controller (MVC) pattern with FluxFast and MySQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fluxfast>=1.1.0",
    "fastapi>=0.115.0",
    "pydantic[email]>=2.9.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "asyncmy>=0.2.9",
    "pymysql>=1.1.0",
    "aiosqlite>=0.20.0",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.4.0",
    "alembic>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
